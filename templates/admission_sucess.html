{% extends "homepage.html" %}
{% block content %}
<div class="container mx-auto mt-20 px-4 md:px-6 text-center">
  <h2 class="text-3xl font-bold text-blue-900 mb-4">🎉 Admission Successful!</h2>
  <p class="text-gray-800 mb-4">{{ message }}</p>
  <p><strong>Name:</strong> {{ student.name }}</p>
  <p><strong>Class:</strong> {{ student.applying_class }}</p>
  <p><strong>Amount Paid:</strong> NPR {{ student.amount_paid }}</p>
  <button onclick="window.location.href='{{ url_for('views.homepage') }}'" class="mt-6 bg-blue-900 text-yellow-400 px-6 py-2 rounded hover:scale-105 transition">
    Back to Home
  </button>
</div>
{% endblock %}
