<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO -->
    <meta name="description" content="Login to the School Management System portal for students and teachers.">
    <meta name="keywords" content="School Login, Student Portal, Teacher Portal">
    <meta name="author" content="School Management System">

    <title>Login | School Portal</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            background: orange;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Glass card */
        .login-card {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            color: white;
            animation: fadeIn 1s ease;
        }

        @keyframes fadeIn {
            from {opacity:0; transform: translateY(20px);}
            to {opacity:1; transform: translateY(0);}
        }

        .login-title {
            font-weight: 700;
            text-align: center;
            margin-bottom: 5px;
        }

        .login-subtitle {
            text-align: center;
            font-size: 0.9rem;
            margin-bottom: 25px;
            opacity: 0.9;
        }

        .form-control {
            border-radius: 10px;
            padding: 12px;
        }

        .btn-login {
            background: linear-gradient(90deg, #ff9800, #ff5722);
            border: none;
            border-radius: 10px;
            font-weight: 600;
            padding: 12px;
            transition: 0.3s;
        }

        .btn-login:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .bottom-text a {
            color: #ffd54f;
            font-weight: 600;
            text-decoration: none;
        }

        .bottom-text a:hover {
            text-decoration: underline;
        }

        .flash-msg {
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .flash-success { background: #28a745; }
        .flash-danger { background: #dc3545; }

    </style>
</head>

<body>

    <div class="login-card">

        <h2 class="login-title">Welcome Back 👋</h2>
        <p class="login-subtitle">Login to access your dashboard</p>

        <!-- Flash Messages -->
        {% for category, msg in get_flashed_messages(with_categories=true) %}
            <div class="flash-msg {% if category == 'danger' %}flash-danger{% else %}flash-success{% endif %}">
                {{ msg }}
            </div>
        {% endfor %}

        <!-- Login Form -->
        <form action="{{ url_for('auth.login') }}" method="POST">

            <div class="mb-3">
                <input type="email" name="email" class="form-control" placeholder="Email Address" required>
            </div>

            <div class="mb-3">
                <input type="password" name="password" class="form-control" placeholder="Password" required>
            </div>

            <button type="submit" class="btn btn-login w-100 text-white">Login</button>
        </form>

        <p class="bottom-text text-center mt-4">
            Don't have an account?
            <a href="{{ url_for('auth.signup') }}">Sign Up</a>
        </p>

    </div>

</body>
</html>
