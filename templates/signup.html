<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO -->
    <meta name="description" content="Create a student or teacher account for the School Management System.">
    <meta name="keywords" content="School Signup, Student Registration, Teacher Registration">
    <meta name="author" content="School Management System">

    <title>Sign Up | School Portal</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #ff9800, #ff5722);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .signup-card {
            width: 100%;
            max-width: 450px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            color: white;
            animation: fadeIn 1s ease;
        }

        @keyframes fadeIn {
            from {opacity:0; transform: translateY(20px);}
            to {opacity:1; transform: translateY(0);}
        }

        .signup-title {
            font-weight: 700;
            text-align: center;
        }

        .signup-subtitle {
            text-align: center;
            font-size: 0.9rem;
            margin-bottom: 20px;
            opacity: 0.9;
        }

        .form-control, .form-select {
            border-radius: 10px;
            padding: 12px;
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
        }

        .form-control::placeholder {
            color: rgba(255,255,255,0.7);
        }

        .btn-signup {
            background: linear-gradient(90deg, #00c6ff, #0072ff);
            border: none;
            border-radius: 10px;
            font-weight: 600;
            padding: 12px;
            transition: 0.3s;
            color: white;
        }

        .btn-signup:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .bottom-text a {
            color: #ffd54f;
            font-weight: 600;
            text-decoration: none;
        }

        .bottom-text a:hover {
            text-decoration: underline;
        }

        .flash-msg {
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .flash-success { background: #28a745; }
        .flash-danger { background: #dc3545; }
    </style>
</head>

<body>

    <div class="signup-card">

        <h2 class="signup-title">Create Account ✨</h2>
        <p class="signup-subtitle">Register as Student or Teacher</p>

        <!-- Flash Messages -->
        {% for category, msg in get_flashed_messages(with_categories=true) %}
            <div class="flash-msg {% if category == 'danger' %}flash-danger{% else %}flash-success{% endif %}">
                {{ msg }}
            </div>
        {% endfor %}

        <!-- Signup Form -->
        <form action="{{ url_for('auth.signup') }}" method="POST" novalidate>
            <div class="mb-3">
                <input type="text" name="username" class="form-control" placeholder="Full Name" required>
            </div>

            <div class="mb-3">
                <input type="email" name="email" class="form-control" placeholder="Email Address" required>
            </div>

            <div class="mb-3">
                <input type="password" name="password" class="form-control" placeholder="Password" required>
            </div>

            <div class="mb-3">
                <input type="password" name="confirm_password" class="form-control" placeholder="Confirm Password" required>
            </div>

            <div class="mb-3">
                <select name="role" class="form-select" required>
                    <option value="" disabled selected>Select Role</option>
                    <option value="student">Student</option>
                    <option value="teacher">Teacher</option>
                </select>
            </div>

            <button type="submit" class="btn btn-signup w-100">Sign Up</button>
        </form>

        <p class="bottom-text text-center mt-4">
            Already have an account?
            <a href="{{ url_for('auth.login') }}">Login</a>
        </p>

    </div>

</body>
</html>
